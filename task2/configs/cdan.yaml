base: base.yaml
method: cdan
# Same discriminator / GRL schedule / loss weight as DANN; its input is vec(f (x) p) (512 * 7 dims).
# No entropy conditioning; f and p are not detached (both per the spec).
discriminator:
  hidden_dim: 256
  dropout: 0.5
grl_schedule:
  gamma: 10.0
  max_alpha: 1.0
loss:
  domain_loss_weight: 1.0
