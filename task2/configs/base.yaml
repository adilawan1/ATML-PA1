# Shared by every Task 2 method (source-only, DAN, DANN, CDAN). Method files add only their differences.
# Fixed elsewhere by the protocol: ResNet-18 (IMAGENET1K_V1) + 7-way linear head, resize 256 -> random
# 224 crop + flip (train) / center 224 (eval), BatchNorm running stats frozen at ImageNet values.
seed: 6304
train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  max_epochs: 30
  patience: 5 # epochs without improvement in mean source-validation macro-F1
  batch_per_source_domain: 8
  batch_target: 24 # unlabeled Sketch images per step (UDA methods only)
